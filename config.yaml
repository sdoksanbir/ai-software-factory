factory:
  name: "AI Software Factory"
  environment: "development"

models:
  fast_local:
    provider: "openrouter"
    model: "openrouter/free"
    api_base: null
    temperature: 0.1
    timeout_seconds: 120

  capability_resolver:
    provider: "openrouter"
    model: "openrouter/free"
    api_base: null
    temperature: 0.1
    timeout_seconds: 120

  heavy_local:
    provider: "openrouter"
    model: "openrouter/free"
    api_base: null
    temperature: 0.1
    timeout_seconds: 180

  cloud_senior:
    provider: "openai" # Gelecekte env variable ile desteklenecek
    model: "gpt-4o"
    api_base: null
    temperature: 0.1
    timeout_seconds: 60

cloud:
  enabled: true
  max_cost_per_task_usd: 0.00
  max_daily_cost_usd: 0.00

routing:
  default_model: "fast_local"
  heavy_model: "heavy_local"
  cloud_model: "cloud_senior"
  capability_resolver_model: "capability_resolver"

generation:
  max_retries: 1
